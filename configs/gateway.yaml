# THN gateway configuration
#
# This document is validated by `thn validate` and consumed by `thn plan`.
# Unknown keys are rejected rather than ignored: a misspelled setting that is
# silently accepted produces a gateway that is quietly not doing what the
# operator believes it is doing.
#
# Validation order, lowest precedence first:
#   1. compiled defaults
#   2. this file
#   3. THN_* environment variables
#
# Run `thn schema` to print every key this build understands.

schema_version: 1

gateway:
  name: thn-gateway
  # Incremented whenever the configuration changes. Plans, observations and
  # activation records are all keyed on it, so it must move forward, never back.
  generation: 1

  # "This machine is meant to be a gateway." Said out loud, separately from
  # everything below it.
  #
  # THN will happily report that this host has two Ethernet ports, that IPv4
  # forwarding is enabled in the kernel, and that masquerading appears
  # possible. All three are true and none of them is a request. This key is
  # the request, and nothing in THN sets it from an observation — hardware
  # that looks like a gateway is evidence, never intent.
  #
  # Set it to false on a machine you want observed and planned around but not
  # turned into a gateway. `thn validate` then stops demanding roles you did
  # not ask for.
  enabled: true

routing:
  # Forwarding is DESIRED state, not an observation.
  #
  # `thn status` reports what net.ipv4.ip_forward currently says. This says
  # what it should say. `thn plan` compares the two and shows the difference;
  # it does not assume the host is already correct because it happens to be.
  ipv4_forwarding: true
  ipv6_forwarding: true

network:
  # The uplink — the connection carrying the internet.
  #
  # This accepts EITHER form, and the stable ID is the one to prefer:
  #
  #   hw:0123456789abcdef   a stable identity. Survives the NIC moving slots,
  #                          and survives predictable naming being turned off.
  #   eth0                  a kernel interface name. Fine, and what `ip link`
  #                          prints, but it changes when hardware moves.
  #
  # `uplink0` and `downlink0` below are PLACEHOLDERS. They are not kernel
  # interface names on any machine, and they are deliberately not: a document
  # that shipped somebody's real NIC name asserts a fact about their hardware
  # to every machine that installs THN.
  #
  # Replace them. `thn discover` shows what this host actually has and
  # `thn discover --emit` prints a ready-to-paste fragment using stable
  # identities. A placeholder left in place fails the lan-identified and
  # wan-present readiness gates loudly, which is the correct outcome.
  wan: uplink0

  # The downstream interface — the network the gateway's own devices sit on.
  #
  # Same two accepted forms as `wan` above.
  #
  # Leave it empty while the hardware is absent: THN reports an unattached LAN
  # as pending, and will not pick an interface for you.
  lan: downlink0

  # The address THN would place on the LAN interface.
  lan_prefix: 10.77.0.1/24

  # Resolvers for THIS HOST. The DNS service's own upstream list is
  # `dns.upstream` below, which is authoritative for it; this is the fallback
  # used only when that is empty. Setting both to the same values is fine and
  # warned about; setting them to DIFFERENT values is an error.
  dns:
    - 1.1.1.1
    - 9.9.9.9

  mtu: 1500

  # Next hop for the default route. Empty means "use whatever the host has".
  upstream_gateway: ""

nat:
  enabled: true

  # The LAN interface only. Masquerading traffic that arrives on the WAN is a
  # routing loop, and `thn validate` rejects naming the WAN here.
  #
  # Derived from network.lan when empty. It is written out rather than left
  # implicit so the rendered masquerade rule can be reviewed against a named
  # interface.
  interfaces:
    - downlink0

  # Source NAT, stated explicitly. `masquerade.outbound` below is required
  # whenever this is enabled — see the note there.
  masquerade:
    enabled: true

    # The interface masqueraded traffic LEAVES by.
    #
    # This is the outbound half of NAT and is separate from `interfaces` above,
    # which is the inbound half. Without it the rendered masquerade rule would
    # apply to every interface including the LAN, rewriting LAN-to-LAN source
    # addresses — which presents as intermittent hardware failure rather than as
    # the misconfiguration it is.
    #
    # Accepts a logical role ("wan") or an interface name. The role is the form
    # to prefer: it keeps working if the uplink is renamed or moved between
    # slots. `thn validate` rejects masquerading with no outbound at all.
    outbound: wan


firewall:
  enabled: true
  backend: nftables
  # drop is the safe default. `thn validate` warns if NAT is disabled while
  # this is set, because the LAN would be able to reach nothing.
  default_inbound_policy: drop

  # Networks permitted to administer the gateway.
  #
  # THN always emits an administrative rule — without one the device cannot be
  # recovered over SSH, which is the opposite of safe. Left empty that rule
  # admits any source address, and `thn validate` warns on every run, because
  # an unrestricted SSH rule on a machine reachable from the internet is how a
  # gateway gets taken over.
  #
  # Restricting it to the LAN is the narrowest source that is derivable from
  # this document rather than from the host.
  #
  # ADD YOUR MANAGEMENT PATH HERE BEFORE DEPLOYING.
  #
  # If you administer this device over a VPN or from anywhere outside the LAN,
  # its range must be listed too or the firewall will refuse your own session
  # and the device will need physical access to recover. Verify the rendered
  # rule with `thn firewall render` before loading anything.
  admin_sources:
    - 10.77.0.0/24

qos:
  # Off by default: the correct shaped rate depends on the uplink actually
  # present, which THN cannot know while the hardware is absent. Enabling this
  # with a guessed rate would silently cap a real link.
  enabled: false

  # cake shapes toward the configured bandwidth, which is what actually
  # reduces bufferbloat. fq_codel only smooths bursts and controls the local
  # queue. THN falls back to fq_codel on a kernel without cake and says so
  # loudly, because the fallback does not fix latency under load.
  algorithm: cake

  # The uplink facing the bottleneck. Shaping belongs there, not on the LAN:
  # the queue that needs shortening is the one on the slow side.
  interface: ""

  # What the link is actually provisioned for, not what the interface
  # negotiates. A 500Mbit/s circuit on a gigabit port is provisioned at 500.
  download_kbps: 0
  upload_kbps: 0

  # Framing overhead compensation, percent. CAKE's bandwidth is the wire rate,
  # so this is added to the figures above before they are passed to tc. Leave
  # it at 0 to take THN's 10% default; 8 to 12 is the realistic range.
  overhead_percent: 0

  # Phase 2: Per-client bandwidth allocations and priority tiers.
  # When configured, THN builds a classful HTB hierarchy on WAN (upload) and
  # LAN (download), attaching leaf CAKE qdiscs and nftables fwmarks to enforce
  # independent limits, guarantees, and priority scheduling.
  # clients:
  #   - id: neighbor-a
  #     ip: 10.77.0.100
  #     download_kbps: 20000
  #     upload_kbps: 5000
  #     priority: low
  #   - id: neighbor-b
  #     ip: 10.77.0.101
  #     download_kbps: 30000
  #     upload_kbps: 10000
  #     priority: normal
  #   - id: admin-workstation
  #     ip: 10.77.0.50
  #     download_kbps: 100000
  #     upload_kbps: 20000
  #     priority: critical

paths:
  config: /etc/thn/config.yaml
  state_dir: /var/lib/thn
  state_db: /var/lib/thn/state.db
  socket: /run/thn/thnd.sock
  run_dir: /run/thn
  # Empty means stdout, which is what systemd's journal captures.
  log_file: ""

dhcp:
  # DHCP is on by default: a gateway that does not serve addresses on its own
  # LAN is not usable out of the box.
  enabled: true

  # Authoritative stops a client that cannot reach this server from obtaining
  # an address from the upstream network, which would place it outside this
  # gateway entirely — including its firewall.
  authoritative: true

  # 12 hours keeps a sleeping laptop's address and reclaims abandoned ones
  # within a day.
  lease_time: 12h

  # 0 leaves the cap to dnsmasq's default.
  lease_max: 0

  # Local domain advertised via option 15.
  domain: lan

  # Start at .100 so the first hundred addresses stay free for static hosts
  # and for the gateway itself.
  ranges:
    - start: 10.77.0.100
      end: 10.77.0.250

  # Addresses pinned to devices. A reservation is intent, not lease state:
  # dnsmasq still issues the lease and THN still observes it.
  #
  #   reservations:
  #     - mac: "aa:bb:cc:dd:ee:ff"
  #       address: 10.77.0.10
  #       hostname: nas
  reservations: []

dns:
  enabled: true

  # Explicit, not inherited from the uplink's DHCP. Inheriting them would make
  # THN's resolution depend on someone else's configuration and would hide a
  # misconfiguration that sent queries somewhere unintended.
  upstream:
    - 1.1.1.1
    - 9.9.9.9

  # Names in this domain are answered locally and never forwarded.
  local_domain: lan

  # Additional names THN serves.
  local_records: []
  #   - hostname: nas
  #     address: 10.77.0.10
  #     aliases:
  #       - storage

  cache_size: 1000

  # Off by default: this writes to disk continuously and is the fastest way
  # to fill a small filesystem. It is the most useful DNS setting for
  # security work, so keep it on only while investigating.
  log_queries: false

  # Off until IPv6 is actually configured. A working AAAA record for a path
  # that does not work yet sends clients down a route that fails slowly
  # rather than letting them fall back to IPv4 immediately.
  no_ipv6: false

services:
  dnsmasq:
    # THN-generated and THN-owned. Overwriting is safe; hand edits are lost on
    # the next render.
    config_file: /etc/thn/dnsmasq.conf

    # Written by dnsmasq, read by THN. THN never writes it.
    lease_file: /var/lib/thn/dnsmasq.leases

logging:
  level: info
  format: json
  retention: 336h0m0s
  max_events: 50000

activation:
  auto_recover: false
  health_check_interval: 30s
  # Must remain true. THN is developed remotely against an unattended device,
  # so holding root over SSH must not by itself be enough to activate. Setting
  # this to false is a validation error, not a warning.
  require_physical_presence: true
