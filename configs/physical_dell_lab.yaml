schema_version: 1
gateway:
  name: thn-gateway
  generation: 1
network:
  # Onboard Intel I219-LM (enp0s31f6), MAC 7c:61:70:fd:7f:34.
  # VERIFY ON THE HOST with `thn discover` before activating: a selector that
  # matches nothing blocks activation rather than silently doing the wrong
  # thing, but it will still cost you a run.
  wan: hw:7c6170fd7f34317a
  # USB Ethernet adapter enx00e099001812, MAC 00:e0:99:00:18:12, USB 0fe6:9900.
  # This link is 10/100 Mbps only. See the activation.development block below.
  lan: hw:2c886f45ad0cb12f
  lan_prefix: 10.77.0.1/24
  mtu: 1500
activation:
  # Must remain true. THN is developed remotely against an unattended device,
  # so holding root over SSH must not by itself be enough to activate. Setting
  # this to false is a validation error, not a warning.
  require_physical_presence: true

  # ---------------------------------------------------------------------------
  # APPROVED FAST ETHERNET LAN ADAPTER (100 Mbps)
  # ---------------------------------------------------------------------------
  # The LAN interface enx00e099001812 is explicitly approved for this deployment.
  #
  # CAUTION: LAN throughput is physically capped at 100 Mbps line rate (~94 Mbps
  # real TCP/IP payload). Clients behind this adapter cannot exceed this speed,
  # regardless of WAN uplink bandwidth.
  approved_fast_ethernet_lan:
    - hw:2c886f45ad0cb12f
nat:
  enabled: true
  masquerade:
    enabled: true
    outbound: wan
firewall:
  enabled: true
qos:
  # THN's own shaping stays OFF here.
  #
  # This is an independent blocker from the adapter: with qos.enabled=true the
  # `subsystems-executable` gate refuses activation until twelve separate
  # physical-enforcement gates have been signed off on real hardware, and
  # activation is blocked whether or not the LAN adapter is approved.
  #
  # CAKE on this host is managed outside THN (it already runs independently),
  # so asking THN to also own the qdisc would put two things in charge of one
  # interface. Leave this false until THN's QoS sign-off is actually done.
  enabled: false
  algorithm: cake
  interface: wan
  download_kbps: 100000
  upload_kbps: 20000
  overhead_percent: 10
  # Client policies can be configured here once neighbors are onboarded.
  # Example:
  # clients:
  #   - id: neighbor-1
  #     ip: 10.77.0.100
  #     download_kbps: 20000
  #     upload_kbps: 5000
  #     priority: high
  clients: []
